<div class="card">

  <h3>{{ book.title | uppercase }}</h3>

  <p>
    Price:
    {{ book.price | currency:'INR' }}
  </p>

  <p>
    Discount Price:
    {{ book.price | discount | currency:'INR' }}
  </p>

  <p>
    Publication Date:
    {{ book.publicationDate | date:'dd/MM/yyyy' }}
  </p>

  <p>
    Description:
    {{ book.description | slice:0:50 }}...
  </p>

</div>
