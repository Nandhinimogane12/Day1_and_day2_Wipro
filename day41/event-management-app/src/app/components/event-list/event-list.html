<h2>Upcoming Events</h2>

<table>

  <tr>
    <th>Event Name</th>
    <th>Date</th>
    <th>Ticket Price</th>
    <th>Category</th>
  </tr>

  <tr
    *ngFor="let event of events"
    appHighlight
    [price]="event.price">

    <td>{{event.name}}</td>
    <td>{{event.date | date:'dd-MMM-yyyy'}}</td>
    <td>{{event.price | priceFormat}}</td>
    <td>{{event.category}}</td>

  </tr>

</table>
